<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dough - Expense Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            bg: '#ffffff',
                            secondary: '#f7f6f3',
                            border: '#e9e9e7',
                            text: '#37352f',
                            textLight: '#787774',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-notion-secondary min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white border-b border-notion-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <!-- Logo/Brand -->
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-2xl font-bold text-notion-text">Dough</a>
                    </div>

                    <!-- Navigation Links -->
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-1">
                        <a href="/" class="{% if request.resolver_match.url_name == 'dashboard' %}bg-notion-secondary{% endif %} text-notion-text hover:bg-notion-secondary px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Dashboard
                        </a>
                        <a href="/admin/transactions/wallet/" class="text-notion-text hover:bg-notion-secondary px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Wallets
                        </a>
                        <a href="{% url 'transactions_log' %}" class="{% if request.resolver_match.url_name == 'transaction_list' %}bg-notion-secondary{% endif %} text-notion-text hover:bg-notion-secondary px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Transactions
                        </a>
                        <a href="{% url 'categories_log' %}" class="{% if request.resolver_match.url_name == 'category_list' %}bg-notion-secondary{% endif %} text-notion-text hover:bg-notion-secondary px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Categories
                        </a>
                        <a href="/admin/transactions/budget/" class="text-notion-text hover:bg-notion-secondary px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Budgets
                        </a>
                    </div>
                </div>

                <!-- Right side items -->
                <div class="flex items-center">
                    <a href="/admin/" class="text-notion-textLight hover:text-notion-text text-sm font-medium transition-colors">
                        Admin
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
